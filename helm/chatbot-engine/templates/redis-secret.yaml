{{- if .Values.redis.enabled }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.redis.passwordSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.redis.passwordSecret }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  password: {{ index $existing.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
